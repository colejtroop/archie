[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archie"
version = "0.1.0"
description = "Embodied Minecraft Bedrock construction research platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
ml = ["torch>=2.6"]

[project.scripts]
archie-demo = "archie.demo:main"
archie-collect = "archie.collector:main"
archie-train-policy = "archie.train_policy:main"
archie-neural-graph = "archie.neural_graph:main"

[tool.setuptools.packages.find]
where = ["src"]

